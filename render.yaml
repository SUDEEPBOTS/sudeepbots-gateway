services:
  - type: web
    name: sudeepbots-gateway
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node scripts/start-render-demo.js
    healthCheckPath: /health

    envVars:
      - key: NODE_VERSION
        value: 24.14.0

      - key: NODE_ENV
        value: production

      - key: YOUPI_BIND_HOST
        value: 0.0.0.0

      - key: USE_SQLITE_FALLBACK
        value: "true"

      - key: GMAIL_USER
        value: akidmd269@gmail.com

      - key: GMAIL_APP_PASSWORD
        value: aidodtrtobsxrinx

      - key: GMAIL_AUTH_MODE
        value: imap

      - key: GMAIL_POLL_INTERVAL_MS
        value: "3000"

      - key: RECEIVING_ACCOUNT_ID
        value: 00000000-0000-0000-0000-000000000002

      - key: DEFAULT_APP_NAME
        value: "SudeepBots Gateway"

      - key: DEFAULT_MERCHANT_NAME
        value: "SudeepBots Store"

      - key: CHECKOUT_PUBLIC_URL
        value: https://pay.yukisbox.com
